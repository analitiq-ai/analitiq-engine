name: publish-cdk

# Publishes the CDK (``cdk/``) to PyPI as ``analitiq-cdk`` when a ``cdk-v*`` tag
# is pushed. Authentication is PyPI Trusted Publishing over GitHub OIDC: the
# ``pypi`` environment's OIDC subject is what PyPI trusts, so no API token is
# stored in this repo or in any secret.
#
# Releasing:
#   1. bump ``version`` in cdk/pyproject.toml and ``__version__`` in
#      cdk/cdk/__init__.py to the same value,
#   2. merge to main,
#   3. ``git tag cdk-v<version> && git push origin cdk-v<version>``,
#   4. approve the pending ``pypi`` deployment in the Actions run.
# The build job refuses to proceed unless all three versions agree, so a
# mistyped tag fails before anything reaches PyPI; the environment's required
# reviewer is the second gate, so a tag push alone never uploads.
#
# The same build job also runs on pull requests that touch cdk/**, so a package
# that cannot be built, fails ``twine check``, or ships without the contract
# artifacts it reads at runtime is caught at review time rather than at release
# time.
#
# A tag push also publishes the ``contract-consumption`` manifest to S3 (the
# ``cdk-release`` channel of sync-contracts-s3.yml): its version is
# ``cdk.__version__``, so the release that ships the wheel is the coordinate
# the contract repo pins the manifest by.

on:
  push:
    tags:
      - "cdk-v*"
  pull_request:
    paths:
      - cdk/**
      - .github/workflows/publish-cdk.yml

jobs:
  build:
    name: build + verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Tag, pyproject and __version__ must name the same version
        # Only meaningful for a tag push; on a PR there is no tag to compare, so
        # the two in-tree sources are still checked against each other.
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          project_version="$(poetry version --short)"
          module_version="$(PYTHONPATH=. python -c 'import cdk; print(cdk.__version__)')"
          if [ "$project_version" != "$module_version" ]; then
            echo "::error::cdk/pyproject.toml version ($project_version) != cdk.__version__ ($module_version)"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "${TAG#cdk-v}" != "$project_version" ]; then
            echo "::error::tag $TAG does not name version $project_version"
            exit 1
          fi
          echo "version $project_version"

      - name: Build sdist and wheel
        run: poetry build

      - name: Validate the rendered package metadata
        run: |
          pipx install twine
          twine check dist/*

      - name: The built distributions carry the published contract artifacts
        # twine check validates metadata; nothing above opens the artifact. The
        # CDK ships three JSON documents beside its own modules (the Arrow type
        # grammar, the conversion matrix, the contract-consumption manifest),
        # and whether a data file lands in a distribution is a packaging
        # decision, not a code one. A distribution missing one imports cleanly
        # and fails on first use -- in every connector repo at once, since the
        # conformance suite reads the grammar. So install the wheel into a
        # clean venv and read every document back through the installed
        # package, from a directory where the source checkout cannot satisfy
        # the import.
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet --upgrade pip
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          sdist="$(ls dist/*.tar.gz)"
          cd /tmp
          SDIST="$OLDPWD/$sdist" /tmp/wheel-check/bin/python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          import cdk
          from cdk.contract_consumption import CONTRACT_CONSUMPTION_PATH, load_published_consumption
          from cdk.type_map.conversions import CONVERSION_MATRIX_PATH, load_published_matrix
          from cdk.type_map.grammar import ARROW_TYPE_GRAMMAR_PATH, load_published_grammar

          installed = Path(cdk.__file__).resolve().parent
          assert "wheel-check" in installed.parts, (
              f"cdk imported from {installed}, not the installed wheel; this "
              f"check would certify the checkout instead of the artifact"
          )

          artifacts = (
              ("arrow type grammar", ARROW_TYPE_GRAMMAR_PATH, load_published_grammar),
              ("conversion matrix", CONVERSION_MATRIX_PATH, load_published_matrix),
              ("contract-consumption manifest", CONTRACT_CONSUMPTION_PATH, load_published_consumption),
          )
          for label, path, load in artifacts:
              assert path.resolve().is_relative_to(installed), (
                  f"the {label} resolves to {path}, outside the installed "
                  f"package"
              )
              assert load(), f"the {label} loaded from the wheel is empty"
              print(f"wheel carries the {label}: {path.name}")

          # The sdist is published too, and a source install rebuilds from it.
          with tarfile.open(os.environ["SDIST"]) as archive:
              members = {Path(name).name for name in archive.getnames()}
          for label, path, _load in artifacts:
              assert path.name in members, (
                  f"the sdist ships no {path.name}; a source install of this "
                  f"release would have no {label}"
              )
              print(f"sdist carries the {label}: {path.name}")

          # The manifest is published at this release's version; a wheel whose
          # manifest names another version would ship a coordinate no S3 object
          # answers to.
          manifest_version = load_published_consumption()["version"]
          assert manifest_version == cdk.__version__, (
              f"contract_consumption.json declares version {manifest_version}, "
              f"the wheel is {cdk.__version__}; regenerate the manifest"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: analitiq-cdk-dist
          path: cdk/dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for analitiq-cdk pins this repository, this
    # workflow filename and this environment name; changing any of the three
    # requires updating the publisher on PyPI. The environment also carries a
    # required reviewer, so the upload waits for a human approval on the run.
    environment:
      name: pypi
      url: https://pypi.org/p/analitiq-cdk
    permissions:
      # Mints the short-lived OIDC token PyPI exchanges for an upload token.
      # No other permission is needed: this job does not touch the repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: analitiq-cdk-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  sync-s3:
    name: publish contract-consumption to S3
    if: github.ref_type == 'tag'
    needs: build
    uses: ./.github/workflows/sync-contracts-s3.yml
    permissions:
      contents: read
      id-token: write
    with:
      channel: cdk-release
      ref: ${{ github.ref }}
