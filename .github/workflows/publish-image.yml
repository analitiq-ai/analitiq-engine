name: publish-image

# Releasing:
#   1. bump ``version`` in pyproject.toml and ``__version__`` in src/__init__.py
#      to the same value,
#   2. merge to main,
#   3. ``git tag engine-v<version> && git push origin engine-v<version>``.
# The job refuses to build unless the tag and both versions agree, so a
# mistyped tag fails before anything reaches GHCR. The image is published as
# `ghcr.io/analitiq-ai/analitiq-engine:<version>` and `:<version>-<short sha>`.
# Provenance and SBOM are off so the push is one image manifest, not an index:
# consumers pin and copy it by that digest.

on:
  push:
    tags:
      - "engine-v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Tag, pyproject and __version__ must name the same version
        id: image
        run: |
          set -euo pipefail
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')"
          module_version="$(python3 -c 'import ast; print(next(n.value.value for n in ast.parse(open("src/__init__.py").read()).body if isinstance(n, ast.Assign) and n.targets[0].id == "__version__"))')"
          if [ "$project_version" != "$module_version" ]; then
            echo "::error::pyproject.toml version ($project_version) != src.__version__ ($module_version)"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#engine-v}" != "$project_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name version $project_version"
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/analitiq-ai/analitiq-engine:${{ steps.image.outputs.version }}
            ghcr.io/analitiq-ai/analitiq-engine:${{ steps.image.outputs.version }}-${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
