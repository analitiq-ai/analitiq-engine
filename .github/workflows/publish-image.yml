name: publish-image

# Release: push a tag `engine-v<version>`; the image is published as
# `ghcr.io/analitiq-ai/analitiq-engine:<version>` and `:<version>-<short sha>`.
# Provenance and SBOM are off so the push is one image manifest, not an index:
# consumers pin and copy it by that digest.

on:
  push:
    tags:
      - "engine-v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Image tags
        id: image
        run: |
          echo "version=${GITHUB_REF_NAME#engine-v}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/analitiq-ai/analitiq-engine:${{ steps.image.outputs.version }}
            ghcr.io/analitiq-ai/analitiq-engine:${{ steps.image.outputs.version }}-${{ steps.image.outputs.short_sha }}
