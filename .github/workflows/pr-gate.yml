name: pr-gate

# Posts the `codex-review` and `internal-review` check runs on each open PR's
# head, signed by the analitiq-pr-gate App. The job lives here, not in a
# reusable workflow, because only a job in this repo can use the `pr-gate`
# environment, whose key is limited to the default branch. analitiq-ai/.github's
# README, section `pr-gate.yml` and the `pr-gate` action, owns this job's shape
# and what the check runs mean.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  repository_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions: {}

jobs:
  gate:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.comment.user.login == 'Analitiq-Bot'))
    runs-on: ubuntu-latest
    environment:
      name: pr-gate
      deployment: false
    concurrency:
      group: pr-gate-${{ github.event.pull_request.number || github.event.issue.number || 'sweep' }}
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PR_GATE_CLIENT_ID }}
          private-key: ${{ secrets.PR_GATE_APP_KEY }}
          permission-checks: write
          permission-pull-requests: read
          permission-issues: read
          permission-contents: read
      - uses: analitiq-ai/.github/.github/actions/pr-gate@6981918909c81fb2a884588a98512ba0444b697d
        with:
          token: ${{ steps.token.outputs.token }}
