[tool.poetry]
name = "analitiq-cdk"
version = "0.2.1"
description = "Analitiq Connector Development Kit: vendor-neutral, transport-neutral building blocks (transports, ConnectionRuntime, type-map, secrets seam, query builder, read/write contracts) shared by the engine and the cloud control-plane."
authors = ["Analitiq Core Team <dev@analitiq.com>"]
# Matches the repository LICENSE (Apache-2.0), which is the licence the shipped
# source is actually under.
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/analitiq-ai/analitiq-engine"
repository = "https://github.com/analitiq-ai/analitiq-engine"
documentation = "https://github.com/analitiq-ai/analitiq-engine/blob/main/docs/connector-module-architecture.md"
keywords = ["connector", "cdk", "etl", "data-integration", "arrow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
packages = [{ include = "cdk" }]

[tool.poetry.dependencies]
# The CDK is deliberately small: it knows SQL-in-general and HTTP, never a
# specific database (the "would this change when you add Clickhouse?" test) and
# never the streaming wire protocol. Explicitly NOT grpcio / protobuf.
# Per-driver DB packages (asyncpg, adbc-driver-*, ...) are pulled in by the
# connector that needs them, not by the CDK core.
#
# Core surface = the SQL control-plane: ``cdk.sql`` discovery + standalone
# ``create_table`` over SQLAlchemy, the ConnectionRuntime/transport seam, the
# type-map and secrets machinery. That surface needs only SQLAlchemy + Pydantic.
# Arrow columnar streaming (pyarrow) and the HTTP transport (aiohttp) are
# opt-in extras so a database-only consumer (e.g. a control-plane process that
# only introspects schemas and creates tables) installs neither.
python = "^3.11"
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
# 2.12 is the floor ``analitiq-contract-models`` needs; the CDK has no use of
# its own for anything newer than 2.0.
pydantic = "^2.12"
# Core, and the reason is the whole of issue #454: an endpoint document read
# as a dict makes "which contract fields does the engine actually use" a
# string-reachability question that no tool can answer, and four contract
# fields shipped unread because of it. Read as the published model, an unused
# field is an unused attribute -- answerable statically, including from
# outside this repo.
#
# Declared as a RANGE rather than a pin: within a contract major the models
# are additive, so a new optional field needs no CDK release. Only a contract
# MAJOR moves this, and that already breaks every consumer.
# Floor is the rc the CDK actually compiles against, not the start of the
# major: within a released major the models are additive, but across the
# rc series they are not, and this package imports names that accrued over
# it (DatabaseEndpointDoc, WriteInput.schema_, SingleCursorMapping,
# validate_endpoint_ref). A lower floor resolves for pip and then fails at
# import.
analitiq-contract-models = { version = ">=1.0.0rc23,<2", allow-prereleases = true }
# Core, on purpose, though only the HTTP transport sends a request: yarl is
# what aiohttp builds every URL with, so it is the authority on what an
# endpoint's URL means. Keeping it behind the [api] extra is what forced the
# transport rules and the conformance kit to re-derive URL syntax by hand --
# and a hand copy is always one rule behind. SQLAlchemy is core for the
# identical reason on the SQL side: the kit compiles a read without a
# database, and it must compile it the way the engine does.
yarl = "^1.20"
# Optional: Arrow columnar read/write (read_batches / write_batch, schema
# casting, the ADBC reader, the DDL type renderers).
pyarrow = { version = ">=14.0.0", optional = true }
# Optional: HTTP transport for API connectors, plus what the generic API
# connector itself needs on that transport: bounded transport retries and a
# JSON encoder that renders datetimes and decimals losslessly.
aiohttp = { version = "^3.8.0", optional = true }
aiohttp-retry = { version = "^2.8.3", optional = true }
orjson = { version = "^3.9.0", optional = true }
# Optional: the API connector parses a stored replication cursor with
# dateutil's ISO parser. The stdlib parser accepts a strictly narrower set of
# strings, and a cursor string is provider data -- narrowing what parses would
# silently start failing cursors that work today.
python-dateutil = { version = "^2.8.0", optional = true }
# Optional: the local filesystem storage backend behind the file destination
# kind (cdk.file.local_backend) writes through aiofiles.
aiofiles = { version = "^23.0.0", optional = true }
# Optional: S3 / S3-compatible object store for s3:// secret refs
# (cdk.secrets.resolvers.scheme.SchemeSecretsResolver s3 scheme).
boto3 = { version = "^1.26.0", optional = true }
# Optional: the connector conformance suite (cdk.conformance) a connector
# repo runs in its own CI against the pinned CDK version (issue #391).
pytest = { version = ">=7.0", optional = true }

[tool.poetry.extras]
# Arrow columnar streaming surface (cdk.schema_contract,
# cdk.sql.adbc_reader, type_map.parse_arrow_type, GenericSQLConnector read/write).
arrow = ["pyarrow"]
# HTTP transport for API connectors (cdk.transport_factory http builder) and
# the generic API connector (cdk.api). pyarrow rides along because
# GenericAPIConnector reads into Arrow batches and inherits the Arrow-based
# destination handler -- `analitiq-cdk[api]` is what cdk.api's import error
# tells the user to install, so it has to be enough to import it.
api = ["aiohttp", "aiohttp-retry", "orjson", "python-dateutil", "pyarrow"]
# The file / s3 destination family (cdk.file). pyarrow rides along because
# GenericFileConnector inherits the Arrow-based destination handler --
# `analitiq-cdk[file]` is what cdk.file's import error names, so it has to be
# enough to import it (same rule as [api]).
file = ["aiofiles", "pyarrow"]
# s3:// secret refs (SchemeSecretsResolver s3 scheme). Lazy boto3 import, so the
# CDK core stays dependency-light and cloud-free unless a connection uses it.
s3 = ["boto3"]
# Full streaming connector surface the engine consumes: every family the CDK
# ships, so the engine's worker can construct any kind default.
streaming = [
    "pyarrow",
    "aiohttp",
    "aiohttp-retry",
    "orjson",
    "python-dateutil",
    "aiofiles",
]
# The connector conformance suite (issue #391): tier 1 contract tests and
# the tier 2 live suite a connector repo runs in its own CI.
# `pytest --pyargs cdk.conformance.tier1 --connector-dir .`
conformance = ["pytest", "pyarrow"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
