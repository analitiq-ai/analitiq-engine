version = 1

# Mark everything under tests/ as test code. DeepSource then applies
# test-appropriate rules to these files and suppresses checks that are false
# positives for pytest -- notably PTC-W0049 (no-self-use), since pytest test
# methods idiomatically take `self` without using it (the class is only a
# grouping for collection). The conformance suite's tier1/tier2 packages
# (issue #391) are shipped WITH the CDK but are pytest modules by nature --
# assert statements are their mechanism, exactly the BAN-B101 false-positive
# class test_patterns exists to suppress. The rest of cdk/cdk/conformance is
# ordinary library code (target loading, the checks, violation reporting) and
# is analysed as such: it carries no asserts and earns no exemption.
test_patterns = [
  "tests/**",
  "cdk/cdk/conformance/tier1/**",
  "cdk/cdk/conformance/tier2/**",
]

# protoc writes the *_pb2 modules under src/grpc/generated/. They are not
# hand-edited and are overwritten on every regeneration, so findings there are
# unactionable --
# any fix is discarded by the next protoc run. Analysing it also buries the
# findings in first-party code: the generated stubs alone accounted for roughly
# 110 of ~345 live occurrences (PYL-W0212, PYL-R0205, PTC-W0068, PY-W2000).
exclude_patterns = ["src/grpc/generated/**"]

[[analyzers]]
name = "python"

  [analyzers.meta]
  runtime_version = "3.x.x"

# The branch-protection rule on `main` requires a status from the Docker,
# Shell and Secrets analyzers as well as Python. DeepSource only reports a
# status for an analyzer that is enabled here, so with Python alone those
# three contexts stayed "Expected" forever and every merge needed an admin
# override. They are enabled rather than dropped from the rule: the repo
# ships a Dockerfile the runtime image is built from and three shell scripts
# the image and the proto regeneration run, so all three have something real
# to analyse.
[[analyzers]]
name = "docker"

[[analyzers]]
name = "shell"

[[analyzers]]
name = "secrets"
